<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Banyak | Mochi &amp; Lukchup</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pesan-banyak.css">
</head>
<body>

    <div id="site-header"></div>
    <script src="js/layout.js"></script>

    <div class="container pb-wrap">
        <div class="pb-grid">

            <form class="pb-form" id="pb-form" novalidate>
                <h2>Formulir Pemesanan</h2>
                <p class="pb-sub">Isi data di bawah ini, lalu pesananmu disiapkan dan dikirim lewat WhatsApp.</p>

                <label for="pb-nama">Nama lengkap <span class="pb-req" aria-hidden="true">*</span></label>
                <input type="text" id="pb-nama" autocomplete="name" placeholder="Masukkan nama lengkap Anda" required aria-required="true">

                <label for="pb-wa">Nomor WhatsApp <span class="pb-req" aria-hidden="true">*</span></label>
                <input type="tel" id="pb-wa" inputmode="tel" autocomplete="tel" placeholder="Contoh: 0812-3456-7890" required aria-required="true">

                <label for="pb-produk">Produk yang ingin dipesan</label>
                <select id="pb-produk"></select>

                <label for="pb-jumlah">Jumlah pesanan</label>
                <input type="number" id="pb-jumlah" min="1" step="1" inputmode="numeric" placeholder="Masukkan jumlah pesanan">

                <label for="pb-kemasan">Kemasan <small>Opsional</small></label>
                <select id="pb-kemasan"></select>

                <label for="pb-tgl">Kapan produk harus dikirimkan? <small>Opsional, bantu kami menjadwalkan produksi</small></label>
                <input type="date" id="pb-tgl">

                <label for="pb-catatan">Catatan khusus <small>Opsional, ceritakan kebutuhan acara Anda</small></label>
                <textarea id="pb-catatan" rows="4"></textarea>

                <button type="submit" class="pb-submit">Kirim Permintaan Pesanan</button>
                <p class="pb-msg" id="pb-msg" role="status" aria-live="polite"></p>
            </form>

            <aside class="pb-side">
                <div class="pb-card">
                    <h3>Ingin Konsultasi atau Fast Response?</h3>
                    <p>Chat langsung dengan kami via WhatsApp. Kami siap membantu kebutuhan acara Anda.</p>
                    <div class="pb-num" id="pb-num"></div>
                    <a class="pb-wa" id="pb-chat" href="#" target="_blank" rel="noopener">Chat via WhatsApp</a>
                </div>

                <div class="pb-promo">
                    <img src="img/dubai_chewy_cookie.jpg" alt="Dubai Chewy Cookie">
                    <div class="pb-promo-text"><strong>Dubai Chewy Cookie</strong><span>Spesial Jumat</span></div>
                </div>
            </aside>

        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/pesan-banyak.js"></script>
</body>
</html>
